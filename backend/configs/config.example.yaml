# Homelab Control Configuration
# Copy this to config.yaml and update with your host details.

server:
  # Port for the REST API server
  port: 18734
  # Bind address: 127.0.0.1 for local-only (plugin proxies API through PHP)
  bind: "127.0.0.1"
  # Optional browser origins for a separate standalone webapp.
  # Same-host requests are always allowed. Use exact http(s) origins.
  # "*" allows any origin and should only be used on trusted networks.
  allowed_origins: []

ssh:
  # Path to the SSH private key (ed25519 recommended)
  key_path: "~/.ssh/id_ed25519"
  # Connection timeout per host
  connect_timeout: "5s"
  # Keepalive interval to prevent SSH drops
  keepalive_interval: "30s"
  # Host key verification: strict, accept-new, or off
  strict_host_key_checking: "accept-new"

# Snapshot cache TTL (reduces SSH polling)
cache_ttl: "3s"

docker:
  # Git-backed Docker Compose desired-state repository.
  # The /api/v1/stacks endpoint reads stacks/<host>/<stack>/compose.yaml here.
  compose_repo_path: "../homelab-docker"
  # Optional DockMon dashboard URL surfaced by Docker diagnostics.
  dockmon_url: "https://dockmon.brdweb.com"

# Optional login for the standalone web application.
# Generate password_hash with:
#   htpasswd -bnBC 10 "" your-password | tr -d ':\n'
auth:
  enabled: false
  username: "admin"
  password_hash: ""
  session_ttl: "12h"

enable_events_stream: true

# Docker hosts to surface in inventory. The legacy mode field remains required
# until the old SSH runtime endpoints are fully replaced by Docker/DockMon APIs.
hosts:
  - name: "yoda-docker"
    address: "192.168.40.60"
    port: 22
    user: "your-user"
    mode: "rootful"

  - name: "xwing-docker"
    address: "192.168.40.80"
    port: 22
    user: "your-user"
    mode: "rootful"

  - name: "obiwan-docker"
    address: "192.168.40.70"
    port: 22
    user: "your-user"
    mode: "rootful"
